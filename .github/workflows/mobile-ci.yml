name: Mobile App CI & APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile-ci.yml'

  # Manual run (Actions tab > Run workflow), e.g. after changing the API_URL repository variable.
  workflow_dispatch:

permissions:
  contents: write # needed to create or update the GitHub Release

jobs:
  build-apk:
    name: Test & Build APK
    runs-on: ubuntu-latest
    env:
      # The deployed API address, from the repository variable API_URL (Settings > Secrets and variables >
      # Actions > Variables), e.g. https://uposhom.duckdns.org. Not a secret. Defaults to the team API.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://uposhom.duckdns.org' }}
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      # D owns the Expo project. Until it lands, this workflow stays green and builds nothing.
      - name: Detect Expo project
        id: expo
        run: |
          if [ -f apps/mobile/app.config.ts ] || [ -f apps/mobile/app.json ] || [ -f apps/mobile/app.config.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Expo project in apps/mobile yet, skipping APK build"
          fi

      - name: Setup pnpm
        if: steps.expo.outputs.present == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        if: steps.expo.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.expo.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck, Lint & Unit Tests
        if: steps.expo.outputs.present == 'true'
        run: |
          pnpm --filter "@uposhom/mobile" typecheck
          pnpm --filter "@uposhom/mobile" lint
          pnpm --filter "@uposhom/mobile" test

      - name: Set up JDK 17
        if: steps.expo.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Optional Firebase config for caregiver push. Kept out of the repo: store the file as the repository
      # secret GOOGLE_SERVICES_JSON_BASE64 (base64 of google-services.json). Without it the app still builds.
      - name: Restore google-services.json (optional)
        if: steps.expo.outputs.present == 'true'
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > apps/mobile/google-services.json
            echo "GOOGLE_SERVICES_JSON=./google-services.json" >> "$GITHUB_ENV"
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 is not set, building without Firebase push"
          fi

      - name: Generate Native Android Project
        if: steps.expo.outputs.present == 'true'
        working-directory: apps/mobile
        # Baked into the app at prebuild: the APK talks to the deployed API instead of the in-app mock.
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://uposhom.duckdns.org' }}
          EXPO_PUBLIC_USE_MOCK: '0'
        run: npx expo prebuild --platform android --no-install

      - name: Assemble Release APK
        if: steps.expo.outputs.present == 'true'
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://uposhom.duckdns.org' }}
          EXPO_PUBLIC_USE_MOCK: '0'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        if: steps.expo.outputs.present == 'true'
        run: |
          mkdir -p build-artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk build-artifacts/uposhom-${{ github.sha }}.apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk build-artifacts/uposhom-latest.apk

      - name: Name the tagged APK (v* tags only)
        if: steps.expo.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk build-artifacts/uposhom-${{ github.ref_name }}.apk

      - name: Upload APK Artifact (team convenience, expires, needs GitHub login)
        if: steps.expo.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uposhom-apk
          path: build-artifacts/uposhom-latest.apk
          retention-days: 30

      - name: Publish APK to a public GitHub Release
        if: steps.expo.outputs.present == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Uposhom {0}', github.ref_name) || 'Latest build (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: ${{ startsWith(github.ref, 'refs/tags/v') && format('build-artifacts/uposhom-{0}.apk', github.ref_name) || 'build-artifacts/uposhom-latest.apk' }}
